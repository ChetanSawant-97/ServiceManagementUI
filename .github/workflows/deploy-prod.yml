name: Deploy PROD to Contabo Server

on:
  push:
    branches:
      - prod # <-- Triggers ONLY when you push to the prod branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application (Production)
        # Assuming you use a prod environment file in Angular
        run: npm run build -- --configuration production 

      - name: Deploy to Server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/system-management/browser/*"
          target: "/var/www/system-management-prod" # <-- Points to your NEW empty folder
          strip_components: 3
          rm: true # <-- Cleans up old files automatically