<!-- Outer wrapper -->
<div class="flex flex-col h-full w-full rounded-xl overflow-hidden gap-2 relative">

  <!-- TOP DIV: Header section -->
  <div class="w-full flex flex-col bg-[var(--bg-2)] border border-[var(--line)] px-5 py-3 rounded-[30px] items-center justify-between shrink-0">
    <div class="flex w-full justify-between items-center">
      <h2 class="text-base md:text-lg font-medium md:font-semibold text-gray-800">Orders Management</h2>
      <div class="flex gap-2">
        @if (!isOpen) {
          <button (click)="openForm()" class="hover:cursor-pointer" title="Add Order">
            <i class="pi pi-plus-circle" style="font-size: 1.6rem; color:#245501; font-weight: 500;"></i>
          </button>
        } @else {
          <button (click)="closeForm()" class="hover:cursor-pointer" title="Close Form">
            <i class="pi pi-times-circle" style="font-size: 1.6rem; color:red; font-weight: 500;"></i>
          </button>
        }
      </div>
    </div>
  </div>

  <!-- EXPANDABLE FORM SECTION -->
  @if (isOpen) {
    <!-- Backdrop overlay for mobile -->
    <div class="fixed inset-0 bg-black/40 z-40 md:hidden" (click)="closeForm()"></div>

    <!-- Form Container -->
    <div class="fixed inset-x-4 top-20 z-50 max-h-[85vh] overflow-y-auto bg-white border border-[var(--line)] p-4 rounded-xl shadow-xl shrink-0 transition-all md:static md:inset-auto md:max-h-none md:shadow-sm">        
      <form class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" [formGroup]="orderForm">
      
        <!-- Dealer Selection -->
        <app-input-select 
          class="w-full block" 
          [control]="orderForm.controls.dealerId" 
          [items]="dealerOptions" 
          label="Select Dealer" 
          placeholder="Choose a dealer">
        </app-input-select>
        
        <!-- Customer Name -->
        <app-input-text 
          class="w-full block" 
          [control]="orderForm.controls.customerName" 
          label="Customer Name">
        </app-input-text>
        
        <!-- Customer Number -->
        <app-input-text 
          class="w-full block" 
          [type]="'mobile'"
          [control]="orderForm.controls.customerNumber" 
          label="Customer Number"
          [maxLength]="10">
        </app-input-text>
        
        <!-- NEW: Product Selection (Dropdown) -->
        <app-input-select 
          class="w-full block" 
          [control]="orderForm.controls.productId" 
          [items]="productOptions" 
          label="Select Product" 
          placeholder="Choose a product">
        </app-input-select>
        
        <!-- Product Serial Number -->
        <app-input-text 
          class="w-full block" 
          [control]="orderForm.controls.productSerialNumber" 
          label="Product Serial Number">
        </app-input-text>
        
        <!-- Bill Date -->
        <app-input-date
          class="w-full block" 
          [control]="orderForm.controls.billDate" 
          label="Bill Date">
        </app-input-date>
          
        <!-- Updated control target -->
        <app-modal-uploader 
          [control]="orderForm.controls.billPhotoBase64">
        </app-modal-uploader>
        
      </form>

      <!-- Form Actions Bar -->
      <div class="flex justify-end gap-2 mt-6 pt-3 border-t border-gray-100">
        <span class="text-red-600 text-sm italic mr-auto self-center">{{formErrors[0]}}</span>
        <p-button label="Cancel" [outlined]="true" severity="secondary" styleClass="!text-sm" (onClick)="closeForm()" />
        <p-button label="Save Order" severity="success" styleClass="!text-sm" (onClick)="saveOrder()" [disabled]="orderForm.invalid" [loading]="isSaving" />
      </div>
    </div>
  }

  <!-- Data Table -->
  <div class="flex-1 flex flex-col overflow-hidden bg-gray-50 p-4 rounded-xl border border-[var(--line)] min-h-0">
    <app-table-list
      (edit)="editRow($event)"
      (delete)="deleteRow($event)"
      deleteNameKey="customerName"
      class="flex-1 flex flex-col h-full overflow-hidden"
      [columns]="tableColumns"
      [data]="tableData"
      [loading]="isLoading"
      [rows]="10">
    </app-table-list>    
  </div>

</div>
