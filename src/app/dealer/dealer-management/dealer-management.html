<!-- Outer wrapper -->
<div class="flex flex-col h-full w-full rounded-xl overflow-hidden gap-2 relative">

  <!-- TOP DIV: Header section -->
  <div class="w-full flex flex-col bg-[var(--bg-2)] border border-[var(--line)] px-5 py-3 rounded-[30px] items-center justify-between shrink-0">
    <div class="flex w-full justify-between items-center">
      <h2 class="text-base md:text-lg font-medium md:font-semibold text-gray-800">Dealer Management</h2>
      <div class="flex gap-2">
        @if (!isOpen) {
          <button (click)="openForm()" class="hover:cursor-pointer" title="Add Dealer">
            <i class="pi pi-plus-circle" style="font-size: 1.6rem; color:#245501; font-weight: 500;"></i>
          </button>
        } @else {
          <button (click)="closeForm()" class="hover:cursor-pointer" title="Close Form">
            <i class="pi pi-times-circle" style="font-size: 1.6rem; color:red; font-weight: 500;"></i>
          </button>
        }
      </div>
    </div>
  </div>

  <!-- EXPANDABLE FORM SECTION -->
  @if (isOpen) {
    <!-- Backdrop overlay for mobile -->
    <div class="fixed inset-0 bg-black/40 z-40 md:hidden" (click)="closeForm()"></div>

    <!-- Form Container -->
    <div class="fixed inset-x-4 top-20 z-50 max-h-[85vh] overflow-y-auto bg-white border border-[var(--line)] p-3 rounded-xl shadow-xl shrink-0 transition-all md:static md:inset-auto md:max-h-none md:shadow-sm">
      <p-tabs [value]="currentTab()" (valueChange)="onTabChange($event)">
        <p-tablist>
          @for (tab of dealerTabs; track tab.value) {
            <p-tab [value]="tab.value">
              @if (tab.icon) { <i [class]="tab.icon + ' mr-2'"></i> }
              {{ tab.label }}
            </p-tab>
          }
        </p-tablist>
        
        <p-tabpanels>
          <!-- Main Details -->
          <p-tabpanel [value]="0">
            <form class="flex flex-col md:flex-row gap-3 pt-2 my-auto" [formGroup]="dealerForm">
              <app-input-text class="w-full md:w-[30%] block" [control]="dealerForm.controls.dealerName" label="Dealer Name"></app-input-text>
              <app-input-text class="w-full md:w-[15%] block" [control]="dealerForm.controls.branchCode" label="Branch Code"></app-input-text>
              <app-input-text class="w-full md:w-[20%] block" [type]="'email'" [control]="dealerForm.controls.emailId" label="Email"></app-input-text>
              <app-input-text class="w-full md:w-[15%] block" [type]="'mobile'" [control]="dealerForm.controls.mobileNo" label="Mobile Number" [maxLength]="10"></app-input-text>
              <!-- Checking isActive manually as requested -->
              <app-input-check-box class="w-auto block my-auto" [control]="dealerForm.controls.isActive" label="Is Active"></app-input-check-box>
            </form>
          </p-tabpanel>
          
          <!-- Address Tab -->
          <p-tabpanel [value]="1">
            <app-address-component 
                class="pt-2 block" 
                [firstLine]="dealerForm.controls.addressLine1"
                [secondLine]="dealerForm.controls.addressLine2"
                [landMark]="dealerForm.controls.landmark"
                [area]="dealerForm.controls.area"
                [city]="dealerForm.controls.city"
                [state]="dealerForm.controls.state"
                [pincode]="dealerForm.controls.pinCode">
            </app-address-component>
          </p-tabpanel>
          <p-tabpanel [value]="2">
            <app-input-text class="w-full md:w-[30%] block" [control]="dealerForm.controls.username" label="Login Usernamw"></app-input-text>
            <app-input-password class="w-full md:w-[30%] block" [control]="dealerForm.controls.password" label="Login Password"></app-input-password>
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>

      <!-- Form Actions Bar -->
      <div class="flex justify-end gap-2 pt-3 border-t border-gray-100">
        <span class="text-red-600 text-sm italic mr-auto self-center">{{formErrors[0]}}</span>
        <p-button label="Cancel" [outlined]="true" severity="secondary" styleClass="!text-sm" (onClick)="closeForm()" />
        <p-button label="Save" severity="success" styleClass="!text-sm" (onClick)="saveDealer()" [disabled]="formErrors.length > 0" [loading]="isSaving" />
      </div>
    </div>
  }

  <!-- Data Table -->
  <div class="flex-1 flex flex-col overflow-hidden bg-gray-50 p-4 rounded-xl border border-[var(--line)] min-h-0">
    <app-table-list
      (edit)="editRow($event)"
      (delete)="deleteRow($event)"
      class="flex-1 flex flex-col h-full overflow-hidden"
      [columns]="tableColumns"
      [data]="tableData"
      [loading]="isLoading"
      [rows]="10">
    </app-table-list>    
  </div>

</div>
