<!-- Outer wrapper -->
<div class="flex flex-col h-full w-full rounded-xl overflow-hidden gap-2 relative">

    <!-- TOP DIV: Header section -->
    <div class="w-full flex flex-col bg-[var(--bg-2)] border border-[var(--line)] px-5 py-3 rounded-[30px] items-center justify-between shrink-0">
      <div class="flex w-full justify-between items-center">
        <h2 class="text-base md:text-lg font-medium md:font-semibold text-gray-800">Leads Management</h2>
        
        <!-- Added Sales Person Dropdown Filter -->
        <div class="flex gap-2 items-center">
          <app-input-select
            class="w-48 md:w-64 block"
            [control]="selectedPersonControl"
            [items]="personOptions"
            label=""
            [showClear]="true"
            placeholder="All Sales Persons"> <!-- Assuming your custom wrapper supports a clear button, highly recommended for filters -->
          </app-input-select>
        </div>
      </div>
    </div>
  
    <!-- Data Table -->
    <div class="flex-1 flex flex-col overflow-hidden bg-gray-50 p-4 rounded-xl border border-[var(--line)] min-h-0">
      
      <app-table-list
        class="flex-1 flex flex-col h-full overflow-hidden"
        [columns]="tableColumns"
        [data]="tableData"
        [loading]="isLoading"
        [showActions]="false"
        [rows]="10">
      </app-table-list>
      
    </div>
  
  </div>
