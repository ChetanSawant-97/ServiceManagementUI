<div class="flex flex-col gap-1 w-full">
    @if (label()) {
      <label [for]="inputId()" class="text-xs sm:text-sm font-medium text-surface-700 dark:text-surface-300">
        {{ label() }}
      </label>
    }
  
    <tui-textfield
      class="w-full !text-xs sm:!text-sm textfield-compact"
      [iconStart]="iconStart()"
      [tuiTextfieldSize]="size()"
    >
      <input
        tuiInput
        [id]="inputId()"
        [type]="currentType()"
        [placeholder]="placeholder()"
        [formControl]="control()"
        class="!text-xs sm:!text-sm !focus-ring-[0.3px]"
      />
  
      <tui-icon
        tuiSlot="right"
        class="cursor-pointer !text-base sm:!text-lg text-surface-500 hover:text-surface-700 transition-colors"
        [icon]="showPassword() ? '@tui.eye-off' : '@tui.eye'"
        (click)="togglePassword()"
      ></tui-icon>
    </tui-textfield>
  </div>
