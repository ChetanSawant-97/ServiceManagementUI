<div class="flex flex-col gap-4 w-full">
  
  <!-- Primary Password Field -->
  <div class="flex flex-col gap-1 w-full">
    @if (label()) {
      <label [for]="inputId()" class="text-xs sm:text-sm font-medium text-surface-700 dark:text-surface-300">
        {{ label() }}
      </label>
    }

    <div class="relative w-full flex items-center">
      @if (iconStart()) {
        <i [class]="iconStart()" class="absolute left-3 text-surface-500 z-10"></i>
      }
      
      <p-password
        [formControl]="control()"
        [inputId]="inputId()"
        [placeholder]="placeholder()"
        [toggleMask]="true"
        [feedback]="showFeedback()"
        [autocomplete]="allowAutofill() ? 'current-password' : 'new-password'"
        class="w-full"
        [inputStyleClass]="
          'w-full !font-sans tracking-wide !text-xs sm:!text-sm ' + 
          (iconStart() ? 'pl-9 ' : '') + 
          (size() === 's' ? 'p-inputtext-sm ' : size() === 'l' ? 'p-inputtext-lg' : '')
        "
      ></p-password>
    </div>
  </div>

  <!-- Conditional Confirm Password Field -->
  @if (requireConfirm()) {
    <div class="flex flex-col gap-1 w-full animate-fade-in">
      <label [for]="confirmInputId" class="text-xs sm:text-sm font-medium text-surface-700 dark:text-surface-300">
        Confirm Password
      </label>

      <div class="relative w-full flex items-center">
        @if (iconStart()) {
          <i [class]="iconStart()" class="absolute left-3 text-surface-500 z-10"></i>
        }
        <p-password
          [formControl]="confirmControl"
          [inputId]="confirmInputId"
          placeholder="Re-enter password"
          [toggleMask]="true"
          [feedback]="false"
          autocomplete="new-password"
          class="w-full"
          [inputStyleClass]="
            'w-full !font-sans tracking-wide !text-xs sm:!text-sm ' + 
            (iconStart() ? 'pl-9 ' : '') + 
            (size() === 's' ? 'p-inputtext-sm ' : size() === 'l' ? 'p-inputtext-lg' : '') +
            (control().hasError('passwordMismatch') && confirmControl.touched ? ' ng-invalid ng-dirty' : '')
          "
        ></p-password>
      </div>
    </div>
  }
  
</div>
