<div class="flex flex-col gap-1 w-full">
  @if (label()) {
      <label [for]="selectId()" class="text-xs sm:text-sm font-[500]" [ngClass]="labelStyleClasses()">
          {{ label() }}
      </label>
  }
  
  <p-select 
    [formControl]="control()" 
    [options]="items()" 
    [inputId]="selectId()"
    [placeholder]="placeholder()"
    appendTo="body"
    [size]="primeSize()"
    styleClass="w-full !text-xs sm:!text-sm"
  ></p-select>
</div>
