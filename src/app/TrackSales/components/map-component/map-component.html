<mgl-map 
  [mapStyle]="mapStyle" 
  [zoom]="mapZoom()"
  [center]="mapCenter()"
  [bounds]="mapBounds()"
  [fitBoundsOptions]="{ padding: 50, duration: 1000 }">

  <!-- Always present now, never conditionally created -->
  <mgl-geojson-source id="history-source" [data]="routeData()"></mgl-geojson-source>
  <mgl-layer
    id="history-line"
    type="line"
    source="history-source"
    [layout]="{ 'line-join': 'round', 'line-cap': 'round', 'visibility': viewMode() === 'history' ? 'visible' : 'none' }"
    [paint]="{ 'line-color': '#10b981', 'line-width': 5 }">
  </mgl-layer>

  <mgl-geojson-source id="live-source" [data]="livePointData() ?? emptyPoint"></mgl-geojson-source>
  <mgl-layer
    id="live-halo"
    type="circle"
    source="live-source"
    [layout]="{ 'visibility': viewMode() === 'live' && livePointData() ? 'visible' : 'none' }"
    [paint]="{ 'circle-radius': 14, 'circle-color': '#3b82f6', 'circle-opacity': 0.3, 'circle-stroke-width': 2, 'circle-stroke-color': '#2563eb' }">
  </mgl-layer>

  <mgl-layer
    id="live-core"
    type="circle"
    source="live-source"
    [layout]="{ 'visibility': viewMode() === 'live' && livePointData() ? 'visible' : 'none' }"
    [paint]="{ 'circle-radius': 6, 'circle-color': '#1d4ed8', 'circle-stroke-width': 2, 'circle-stroke-color': '#ffffff' }">
  </mgl-layer>

</mgl-map>
