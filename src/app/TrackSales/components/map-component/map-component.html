
<mgl-map 
  [mapStyle]="mapStyle" 
  [zoom]="mapZoom()"
  [center]="mapCenter()"
  [bounds]="mapBounds()"
  [fitBoundsOptions]="{ padding: 60, duration: 1000 }"
  [style]="{ 'width': '100%', 'height': '100%', 'display': 'block', 'min-height': '400px' }">

  <!-- ============================================== -->
  <!-- 1. DRAW LINES FIRST (Underneath the markers)   -->
  <!-- ============================================== -->
  <mgl-geojson-source id="history-source" [data]="routeData()"></mgl-geojson-source>

  <!-- Casing: darker, wider, drawn underneath -->
  <mgl-layer
    id="history-line-casing"
    type="line"
    source="history-source"
    [layout]="{ 'line-join': 'round', 'line-cap': 'round', 'visibility': viewMode() === 'history' ? 'visible' : 'none' }"
    [paint]="{ 'line-color': '#0d9668', 'line-width': 8 }">
  </mgl-layer>

  <!-- Main line: brighter, narrower, drawn on top -->
  <mgl-layer
    id="history-line"
    type="line"
    source="history-source"
    [layout]="{ 'line-join': 'round', 'line-cap': 'round', 'visibility': viewMode() === 'history' ? 'visible' : 'none' }"
    [paint]="{ 'line-color': '#34d399', 'line-width': 5 }">
  </mgl-layer>


  <!-- ============================================== -->
  <!-- 2. DRAW TAGS ON TOP OF LINES (High-Impact)     -->
  <!-- ============================================== -->
  <mgl-geojson-source id="tags-source" [data]="tagsGeoJson()"></mgl-geojson-source>

  <mgl-layer
    id="tags-dot-shadow"
    type="circle"
    source="tags-source"
    [paint]="{
      'circle-radius': 7,
      'circle-color': '#000000',
      'circle-opacity': 0.3,
      'circle-translate': [0, 2],
      'circle-blur': 0.5
    }">
  </mgl-layer>

  <mgl-layer
    id="tags-dot"
    type="circle"
    source="tags-source"
    [paint]="{
      'circle-radius': 7,
      'circle-color': '#e11d48',
      'circle-stroke-width': 2.5,
      'circle-stroke-color': '#ffffff'
    }">
  </mgl-layer>

  <mgl-layer
    id="tags-text"
    type="symbol"
    source="tags-source"
    [layout]="{
      'text-field': ['get', 'title'],
      'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
      'text-size': 14,
      'text-offset': [0, 1.2],
      'text-anchor': 'top'
    }"
    [paint]="{
      'text-color': '#000000',
      'text-halo-color': '#ffffff',
      'text-halo-width': 3,
      'text-halo-blur': 0.5
    }">
  </mgl-layer>

  <!-- ============================================== -->
  <!-- 3. DRAW LIVE TRACKING LAST (Absolute top)      -->
  <!-- ============================================== -->
  <mgl-geojson-source id="live-source" [data]="livePointData() ?? emptyPoint"></mgl-geojson-source>

  <mgl-layer
    id="live-halo"
    type="circle"
    source="live-source"
    [layout]="{ 'visibility': (viewMode() === 'live' && livePointData()) ? 'visible' : 'none' }"
    [paint]="{
      'circle-radius': 14,
      'circle-color': '#3b82f6',
      'circle-opacity': 0.3,
      'circle-stroke-width': 2,
      'circle-stroke-color': '#2563eb'
    }">
  </mgl-layer>

  <mgl-layer
    id="live-core"
    type="circle"
    source="live-source"
    [layout]="{ 'visibility': (viewMode() === 'live' && livePointData()) ? 'visible' : 'none' }"
    [paint]="{
      'circle-radius': 6,
      'circle-color': '#1d4ed8',
      'circle-stroke-width': 2,
      'circle-stroke-color': '#ffffff'
    }">
  </mgl-layer>

</mgl-map>
