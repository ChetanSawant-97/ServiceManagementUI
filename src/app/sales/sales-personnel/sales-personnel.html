<!-- Outer wrapper -->
<div class="flex flex-col h-full w-full rounded-xl overflow-hidden gap-2 relative">

  <!-- TOP DIV: Header section -->
  <div class="w-full flex flex-col bg-[var(--bg-2)] border border-[var(--line)] px-5 py-3 rounded-[30px] items-center justify-between shrink-0">
    <div class="flex w-full justify-between items-center">
      <h2 class="text-base md:text-lg font-medium md:font-semibold text-gray-800">Sales Personnel</h2>
      <div class="flex gap-2">
        @if (!isOpen) {
          <button (click)="openForm()" class="hover:cursor-pointer" title="Add Sales Person">
            <i class="pi pi-plus-circle" style="font-size: 1.6rem; color:#245501; font-weight: 500;"></i>
          </button>
        } @else {
          <button (click)="closeForm()" class="hover:cursor-pointer" title="Close Form">
            <i class="pi pi-times-circle" style="font-size: 1.6rem; color:red; font-weight: 500;"></i>
          </button>
        }
      </div>
    </div>
  </div>

  <!-- EXPANDABLE FORM SECTION -->
  @if (isOpen) {
    <!-- Backdrop overlay for mobile -->
    <div class="fixed inset-0 bg-black/40 z-40 md:hidden" (click)="closeForm()"></div>

    <!-- Form Container -->
    <div class="fixed inset-x-4 top-20 z-50 max-h-[85vh] overflow-y-auto bg-white border border-[var(--line)] rounded-xl shadow-xl shrink-0 transition-all md:static md:inset-auto md:max-h-none md:shadow-sm md:overflow-visible md:p-3">
      
      <!-- Removed the flex/overflow classes from p-tabs directly -->
      <p-tabs [value]="currentTab()" (valueChange)="onTabChange($event)">
        
        <!-- STICKY MOBILE TAB HEADER -->
        <p-tablist class="block sticky top-0 z-20 bg-white pt-3 px-3 pb-1 md:static md:p-0 md:bg-transparent">
          @for (tab of salesTabs; track tab.value) {
            <p-tab [value]="tab.value">
              @if (tab.icon) { <i [class]="tab.icon + ' hidden md:inline-block mr-2'"></i> }
              <span class="text-sm md:text-base">{{ tab.label }}</span>
            </p-tab>
          }
        </p-tablist>
        
        <!-- SCROLLABLE TAB CONTENT -->
        <p-tabpanels class="block px-3 pb-3 md:p-0">
          
          <!-- Tab 0: Info -->
          <p-tabpanel [value]="0">
            <form class="flex flex-col md:flex-row md:items-start gap-6 pt-4" [formGroup]="salesForm">
              
              <!-- Left Side: Form Grid (order-2 on mobile pushes it down, order-1 on desktop pulls it left) -->
              <div class="flex-1 order-2 md:order-1 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                
                <app-input-text 
                    class="w-full block" 
                    [control]="salesForm.controls.fullName" 
                    label="Full Name">
                </app-input-text>
    
                <app-input-text 
                    class="w-full block" 
                    [control]="salesForm.controls.username" 
                    label="Login Username">
                </app-input-text>
    
                <app-input-password 
                    class="w-full block" 
                    [control]="salesForm.controls.password" 
                    label="Login Password">
                </app-input-password>
    
                <app-input-select 
                    class="w-full block" 
                    [control]="salesForm.controls.designationId" 
                    [items]="designationOptions" 
                    label="Designation" 
                    placeholder="Select designation">
                </app-input-select>
    
                <app-input-text 
                    class="w-full block" 
                    [type]="'mobile'"
                    [maxLength]="10"
                    [control]="salesForm.controls.mobileNumber" 
                    label="Mobile Number">
                </app-input-text>
    
                <app-input-text 
                    class="w-full block" 
                    [type]="'number'"
                    [maxLength]="12"
                    [control]="salesForm.controls.aadharId" 
                    label="Aadhar ID">
                </app-input-text>
    
                <app-input-text 
                    class="w-full block" 
                    [type]="'alphanumeric'"
                    [maxLength]="10"
                    [control]="salesForm.controls.pancard" 
                    label="PAN Card">
                </app-input-text>
              </div>

              <!-- Right Side (Desktop) / Top Center (Mobile): Profile Upload -->
              <div class="w-full md:w-auto md:min-w-[200px] flex justify-center shrink-0 order-1 md:order-2 md:pl-4 mb-2 md:mb-0">
                  <app-profile-upload 
                      [control]="salesForm.controls.photoBase64"
                      label="Upload Profile Photo">
                  </app-profile-upload>
              </div>

            </form>
          </p-tabpanel>

          <!-- Tab 1: Address -->
          <p-tabpanel [value]="1">
            <app-address-component 
                class="block w-full pt-4" 
                [firstLine]="salesForm.controls.addressLine1"
                [secondLine]="salesForm.controls.addressLine2"
                [landMark]="salesForm.controls.landmark"
                [area]="salesForm.controls.area"
                [city]="salesForm.controls.city"
                [state]="salesForm.controls.state"
                [pincode]="salesForm.controls.pinCode">
            </app-address-component>
          </p-tabpanel>
          
        </p-tabpanels>
      </p-tabs>

      <!-- STICKY MOBILE FORM ACTIONS -->
      <div class="sticky bottom-0 z-20 flex justify-end gap-2 p-3 mt-auto border-t border-gray-100 bg-white md:static md:px-0 md:pb-0 md:bg-transparent">
        <span class="text-red-600 text-xs md:text-sm italic mr-auto self-center">{{formErrors[0]}}</span>
        <p-button label="Cancel" [outlined]="true" severity="secondary" styleClass="!text-sm" (onClick)="closeForm()" />
        <p-button label="Save" severity="success" styleClass="!text-sm" (onClick)="saveSalesPerson()" [disabled]="salesForm.invalid" [loading]="isSaving" />
      </div>

    </div>
  }

  <!-- Data Table -->
  <div class="flex-1 flex flex-col overflow-hidden bg-gray-50 p-4 rounded-xl border border-[var(--line)] min-h-0">
    <app-table-list
      (edit)="editRow($event)"
      (delete)="deleteRow($event)"
      deleteNameKey="fullName"
      class="flex-1 flex flex-col h-full overflow-hidden"
      [columns]="tableColumns"
      [data]="tableData"
      [loading]="isLoading"
      [rows]="10">
    </app-table-list>    
  </div>  

</div>
