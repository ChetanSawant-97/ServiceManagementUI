<div [attr.data-theme]="currentTheme()" class="h-screen w-screen flex flex-col">
  <p-toast />
  
  <!-- Add the async pipe here. The === true ensures strict boolean typing -->
  <p-blockui [blocked]="(toastService.isLoading$ | async) === true">
      <!-- Updated to the strict v18 kebab-case selector -->
      <p-progress-spinner 
          strokeWidth="4" 
          animationDuration=".5s">
      </p-progress-spinner>
  </p-blockui>

  <router-outlet></router-outlet>
</div>
